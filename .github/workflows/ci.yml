name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only everywhere: nothing here publishes or writes to the repository.
permissions:
  contents: read

jobs:
  authorship:
    name: Commits are under the owner's name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Pull request commits
        if: github.event_name == 'pull_request'
        run: python scripts/check_authorship.py "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
      - name: Pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && !github.event.forced
        run: python scripts/check_authorship.py "${{ github.event.before }}..${{ github.sha }}"
      # A new branch, or one rebased and force-pushed (the old tip is gone,
      # so there is no "before" to start from): check all it adds to main.
      - name: Commits on a new or rebased branch
        if: github.event_name == 'push' && (github.event.before == '0000000000000000000000000000000000000000' || github.event.forced)
        run: python scripts/check_authorship.py "origin/main..${{ github.sha }}"

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy

  audit:
    name: Known security problems in dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      # Checks every pinned version in the lock files against the Python
      # Packaging Advisory Database. Nothing is installed or changed.
      # (requirements-dev.lock holds everything in requirements.lock.)
      - name: pip-audit, the app and its test tools
        run: python -m pip_audit --strict --disable-pip --require-hashes -r requirements-dev.lock
      - name: pip-audit, the installer build tools
        run: python -m pip_audit --strict --disable-pip --require-hashes -r requirements-build.lock

  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # "bundled": the Python in .python-version, which the installer
        # packs; 3.11: the lowest pyproject.toml allows.
        python: [bundled, "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python != 'bundled' && matrix.python || '' }}
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Libraries the setup window's tests need to draw off-screen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - name: Tests, with the coverage number on one run
        if: matrix.os == 'ubuntu-latest' && matrix.python == 'bundled'
        run: python -m pytest -q --cov=agent --cov=installer --cov-report=term:skip-covered
      - name: Tests
        if: matrix.os != 'ubuntu-latest' || matrix.python != 'bundled'
        run: python -m pytest -q

  ui-check:
    name: Dashboard in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui_check.py ui-shots-ci --quick
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: ui-shots-ci/
          if-no-files-found: ignore

  installer:
    name: Installer builds, installs and removes cleanly
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Build the setup file
        run: python scripts/build_installer.py
      - name: Install with no window, sign in, check no password was written, remove
        shell: pwsh
        run: python scripts/installer_smoke.py (Get-ChildItem dist/MinecraftServerController-Setup-*.exe).FullName
      - name: Keep the install logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-logs
          path: C:/ProgramData/Minecraft Server Controller/logs/
          if-no-files-found: ignore
      - name: Keep the setup file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup
          path: |
            dist/MinecraftServerController-Setup-*.exe
            dist/MinecraftServerController-Setup-*.exe.sha256
          retention-days: 7
