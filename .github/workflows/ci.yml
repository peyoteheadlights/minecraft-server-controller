name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  authorship:
    name: Commits are under the owner's name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull request commits
        if: github.event_name == 'pull_request'
        run: python scripts/check_authorship.py "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
      - name: Pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_authorship.py "${{ github.event.before }}..${{ github.sha }}"
      - name: Commits on a new branch
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: python scripts/check_authorship.py "origin/main..${{ github.sha }}"

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q

  ui-check:
    name: Dashboard in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui_check.py ui-shots-ci --quick
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-shots-ci/
          if-no-files-found: ignore
