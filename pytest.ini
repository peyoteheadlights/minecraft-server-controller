[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# A test still running after three minutes is stuck (the slowest takes
# seconds). Print where every thread is, so a hang on a CI machine shows up
# in its log instead of only as a cancelled job.
faulthandler_timeout = 180
filterwarnings =
    ignore::DeprecationWarning
