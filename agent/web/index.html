<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Minecraft Server Control</title>
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MC Control">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C1C1F">
<link rel="stylesheet" href="/assets/styles.css">
<script src="/assets/theme.js"></script>
</head>
<body>

<section id="login" class="login">
  <form class="login-panel" id="login-form" novalidate>
    <div class="app-mark" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.8l8.5 4.7v9L12 21.2 3.5 16.5v-9z"/><path d="M3.8 7.6 12 12l8.2-4.4"/><path d="M12 12v9"/></svg>
    </div>
    <h1 id="login-title">Minecraft Server Control</h1>
    <div class="field">
      <label for="username" id="username-label">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password" id="password-label">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div id="login-error" class="banner error" role="alert" hidden></div>
    <button class="btn primary" type="submit" id="login-button">Sign in</button>
  </form>
</section>

<div id="app" class="app">
  <header class="desk" id="desk">
    <div class="tabs" id="server-tabs" role="tablist"></div>
    <div class="desk-tools" id="desk-tools"></div>
  </header>
  <main class="sheet" id="main" tabindex="-1" role="tabpanel">
    <div class="sheet-head" id="sheet-head"></div>
    <nav class="subnav" id="subnav"></nav>
    <div class="sheet-body">
      <header class="toolbar">
        <h1 id="page-title"></h1>
        <div class="grow"></div>
        <div class="toolbar-actions" id="toolbar-actions"></div>
      </header>
      <div id="page" class="page"></div>
    </div>
  </main>
</div>

<section id="offline" class="offline" hidden></section>

<div id="announcer" class="sr-only" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
