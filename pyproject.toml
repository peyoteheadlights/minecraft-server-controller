[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-server-controller"
dynamic = ["version"]
description = "Run and watch a Minecraft server on a Windows PC from a private web dashboard over Tailscale."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# What the app needs. requirements*.lock pins the exact tested versions with
# hashes (made from this file with `uv pip compile`, see docs/testing.md);
# setup.ps1, CI and the installer install only from those locks.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psutil>=5.9",
    "httpx>=0.26",
    "PyYAML>=6.0",
    "cryptography>=42.0",       # TLS certificates, update signatures, Web Push
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "segno>=1.6",               # QR codes for the phone pairing code (pure Python)
]

[project.optional-dependencies]
# Everything needed to run the tests, the browser checks and the CI scans.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "playwright>=1.40",         # then run: python -m playwright install chromium
    "ruff>=0.16",
    "mypy>=2.4",
    "types-PyYAML",
    "types-psutil",
    "pip-audit>=2.7",
    "PySide6-Essentials>=6.8,<6.9",  # the setup window; its tests draw it off-screen
]
# What GitHub Actions needs to build the Windows installer.
build = [
    "pyinstaller>=6.10",
    "PySide6-Essentials>=6.8,<6.9",
]

[tool.setuptools.dynamic]
version = { attr = "agent.__version__" }

[tool.setuptools.packages.find]
include = ["agent*", "installer*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ui-shots"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # pyupgrade
    "ASYNC",   # blocking calls in async code
    "RUF100",  # unused noqa
]
ignore = [
    "E501",     # the formatter handles line length; long strings are left alone
    "ASYNC109", # timeout parameters are part of the managers' public API
    "ASYNC240", # quick pathlib checks; real disk work already runs in threads
    "UP042",    # StrEnum changes str() of the server states
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "agent.security.permissions.require",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["agent", "installer"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# winreg and ctypes.windll only exist on Windows; mypy checks on Linux in CI.
module = ["installer.autostart", "installer.system", "installer.detect", "installer.bootstrap"]
disable_error_code = ["attr-defined"]
