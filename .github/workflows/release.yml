name: Release

# Pushing a tag like v1.2.0 builds the installer, signs the update file,
# records where the files were built (GitHub artifact attestations) and
# publishes a GitHub release. docs/releases.md has the steps.
on:
  push:
    tags: ["v*.*.*"]

# Nothing by default; each job asks for only what it needs.
permissions: {}

jobs:
  build:
    name: Build, sign and attest
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - name: The tag, CHANGELOG, saved API copy and signing key agree
        run: python scripts/release_check.py "${{ github.ref_name }}" --notes dist-notes.md
      - name: Python the installer packs
        run: python --version
      - name: Tests
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pytest -q
      - name: Build the setup file
        run: python scripts/build_installer.py
      - name: Record where the setup file was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/MinecraftServerController-Setup-*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: built
          path: |
            dist/MinecraftServerController-Setup-*.exe
            dist/MinecraftServerController-Setup-*.exe.sha256
            dist-notes.md
          if-no-files-found: error

  # The signing key is only ever in this job, which installs nothing but the
  # app's own (hash-locked) libraries: none of the build or test tools above
  # run while the key is there. The "release" environment lets the owner
  # limit the key to version tags (docs/releases.md).
  sign:
    name: Sign the update file
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: built
          path: built
      - name: Sign
        env:
          MCSC_UPDATE_SIGNING_KEY: ${{ secrets.MCSC_UPDATE_SIGNING_KEY }}
        run: python scripts/sign_release.py built/dist/MinecraftServerController-Setup-*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: |
            built/dist/update.json
            built/dist/update.json.sig
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the only job that can write: it creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: built
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: release/dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Minecraft Server Controller ${TAG#v}" \
            --notes-file release/dist-notes.md \
            release/dist/MinecraftServerController-Setup-*.exe \
            release/dist/MinecraftServerController-Setup-*.exe.sha256 \
            release/dist/update.json \
            release/dist/update.json.sig
