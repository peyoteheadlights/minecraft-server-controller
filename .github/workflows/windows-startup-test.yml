name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-task:
    name: Windows startup task (live Task Scheduler)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MCSC_LIVE_WINDOWS_TESTS: "1"
      # A unique name so the test can never touch a real installation's task.
      MCSC_TASK_NAME: "MCSC CI ${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install requirements
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Register, verify, launch and remove the scheduled task
        run: python -m pytest tests/windows -v
      - name: Show the agent's startup log
        if: always()
        shell: pwsh
        run: if (Test-Path logs/startup.log) { Get-Content logs/startup.log -Tail 40 }
      - name: Remove the task even if a step failed
        if: always()
        shell: cmd
        run: schtasks /Delete /TN "%MCSC_TASK_NAME%" /F >nul 2>&1 & exit /b 0

  setup-script:
    name: setup.ps1 on Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Run the setup script tests
        shell: powershell
        run: .\tests\windows\setup_script_tests.ps1
